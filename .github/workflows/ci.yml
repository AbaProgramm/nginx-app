name: Build and Deploy
on:
  push:
    branches: [main]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout nginx-app
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/nginx-app:${{ github.sha }}

      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: AbaProgramm/k8s-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-repo

      - name: Update image tag in manifest
        run: |
          cd gitops-repo
          sed -i "s|image: .*nginx-app.*|image: ghcr.io/${{ env.OWNER_LC }}/nginx-app:${{ github.sha }}|" apps/nginx/deployment.yaml
          cat apps/nginx/deployment.yaml

      - name: Commit and push manifest change
        run: |
          cd gitops-repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apps/nginx/deployment.yaml
          git commit -m "Update nginx-app image to ${{ github.sha }}" || echo "No changes to commit"
          git push
